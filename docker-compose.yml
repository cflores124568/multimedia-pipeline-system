version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: pipeline-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: MediaPipelineDB
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - pipeline-net

  phase1:
    build:
      context: .
      dockerfile: Dockerfile.phase1
    container_name: pipeline-phase1
    volumes:
      - ./phase1:/app
    working_dir: /app
    networks:
      - pipeline-net
    profiles:
      - phase1

  phase2:
    build:
      context: .
      dockerfile: Dockerfile.phase2
    container_name: pipeline-phase2
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./phase2/input:/app/input
      - ./phase2/output:/app/output
    environment:
      - MONGO_HOST=mongo
    networks:
      - pipeline-net
    profiles:
      - phase2

  phase3:
    build:
      context: .
      dockerfile: Dockerfile.phase3
    container_name: pipeline-phase3
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./phase3:/app
    environment:
      - MONGO_HOST=mongo
      - FRAMEIO_TOKEN=${FRAMEIO_TOKEN}
    networks:
      - pipeline-net
    profiles:
      - phase3

volumes:
  mongo-data:

networks:
  pipeline-net:
    driver: bridge