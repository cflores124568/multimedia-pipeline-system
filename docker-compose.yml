version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: pipeline-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: MediaPipelineDB
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - pipeline-net

  phase2:
    build:
      context: .
      dockerfile: Dockerfile.phase2
    container_name: pipeline-phase2
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./phase2/input:/app/input
      - ./phase2/output:/app/output
    environment:
      - MONGO_HOST=mongo
    networks:
      - pipeline-net

volumes:
  mongo-data:

networks:
  pipeline-net:
    driver: bridge